server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Hashed build files: the name changes with the content, so cache for a year.
  # A missing file must 404, not fall back to index.html.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # PWA entry points must always be revalidated, or users get stuck on an old
  # version of the app (service worker + the HTML that registers it).
  location ~* ^/(index\.html|sw\.js|registerSW\.js)$ {
    add_header Cache-Control "no-cache";
  }

  # nginx's mime table doesn't know .webmanifest
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # React Router: any other path is handled in the browser.
  location / {
    try_files $uri /index.html;
  }
}
